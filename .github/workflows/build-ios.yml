name: Build & Deploy iOS to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'App.tsx', 'app.json', 'package.json']

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Patch metro exports (fix src/lib subpath for RN build scripts)
        run: |
          node -e "
            const path = require.resolve('metro/package.json');
            const pkg = JSON.parse(require('fs').readFileSync(path, 'utf8'));
            if (!pkg.exports['./src/lib/*']) {
              pkg.exports['./src/lib/*'] = './src/lib/*.js';
              require('fs').writeFileSync(path, JSON.stringify(pkg));
              console.log('metro exports patched');
            } else {
              console.log('metro exports already patched');
            }
          "

      - name: Create getUserState shim (Expo SDK @expo/config missing export fix)
        run: |
          node << 'EOF'
          const path = require('path');
          const fs = require('fs');
          try {
            const configDir = path.dirname(require.resolve('@expo/config/package.json'));
            const shimPath = path.join(configDir, 'build', 'getUserState.js');
            if (!fs.existsSync(shimPath)) {
              fs.mkdirSync(path.dirname(shimPath), { recursive: true });
              fs.writeFileSync(shimPath, [
                '"use strict";',
                'Object.defineProperty(exports, "__esModule", { value: true });',
                'exports.getUserState = getUserState;',
                'const path = require("path");',
                'const os = require("os");',
                'function getUserState(filename) {',
                '  return path.join(os.homedir(), ".expo", filename || "state.json");',
                '}'
              ].join('\n'));
              console.log('getUserState shim created at', shimPath);
            } else {
              console.log('getUserState already exists');
            }
          } catch(e) {
            console.log('Shim setup skipped:', e.message);
          }
          EOF

      - name: Prebuild iOS native project
        run: CI=1 npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - name: Import certificate
        run: |
          echo "${{ secrets.IOS_P12_BASE64 }}" | base64 --decode > dist.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import dist.p12 \
            -k build.keychain \
            -P "${{ secrets.IOS_P12_PASSWORD }}" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm dist.p12

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISION_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/f476a334-7fab-4a9e-8c11-10f076a8d7a0.mobileprovision

      - name: Decode App Store Connect key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Build iOS archive
        run: |
          XCWORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -type d | head -1)
          echo "Workspace: $XCWORKSPACE"
          # Auto-detect scheme from workspace
          SCHEME=$(xcodebuild -list -workspace "$XCWORKSPACE" 2>/dev/null | awk '/Schemes:/{found=1; next} found && /^[[:space:]]+[^[:space:]]/{gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print; exit}')
          echo "Detected scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$XCWORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/SalaryCalc.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE="f476a334-7fab-4a9e-8c11-10f076a8d7a0" \
            PROVISIONING_PROFILE_SPECIFIER="Salary Tax Calculator Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates

      - name: Export IPA
        run: |
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>V628699P6F</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>iPhone Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.lukeholder.uksalarytax</key><string>Salary Tax Calculator Distribution</string>
            </dict>
            <key>uploadSymbols</key><true/><key>compileBitcode</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/SalaryCalc.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload to TestFlight
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$(ls $RUNNER_TEMP/export/*.ipa | head -1)" \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salary-calc-ios
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
